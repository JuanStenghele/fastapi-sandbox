name: Lambda - CI/CD Pipeline

on:
  workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test/requirements.txt

      - name: Run tests with coverage
        run: |
          pytest test -v --cov=src --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URL
        id: ecr
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/ecr/repository-url

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.ecr.outputs.value }}:latest
          provenance: false
          sbom: false

  migrate:
    name: Migrate DB
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get DB host
        id: db_host
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/db/host

      - name: Get DB port
        id: db_port
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/db/port

      - name: Get DB name
        id: db_name
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/db/name

      - name: Get DB user
        id: db_user
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/db/user

      - name: Get DB password
        id: db_password
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/db/password
          with_decryption: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB migrations
        env:
          POSTGRES_HOST: ${{ steps.db_host.outputs.value }}
          POSTGRES_PORT: ${{ steps.db_port.outputs.value }}
          POSTGRES_DB: ${{ steps.db_name.outputs.value }}
          POSTGRES_USER: ${{ steps.db_user.outputs.value }}
          POSTGRES_PASSWORD: ${{ steps.db_password.outputs.value }}
          POSTGRES_SSLMODE: require
        run: alembic upgrade head

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ECR repository URL
        id: ecr
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/ecr/repository-url

      - name: Get Lambda function name
        id: lambda
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/lambda/function-name

      - name: Check Lambda function exists
        env:
          FUNCTION_NAME: ${{ steps.lambda.outputs.value }}
        run: |
          if ! aws lambda get-function-configuration --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Lambda function '$FUNCTION_NAME' does not exist"
            exit 1
          fi

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: ${{ steps.lambda.outputs.value }}
          REPOSITORY_URL: ${{ steps.ecr.outputs.value }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$REPOSITORY_URL:latest" --publish

      - name: Wait for function update
        env:
          FUNCTION_NAME: ${{ steps.lambda.outputs.value }}
        run: |
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Get API URL
        id: api
        uses: ./.github/actions/get-ssm-parameter
        with:
          name: /jstenghele-fastapi-sandbox/api/url

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${{ steps.api.outputs.value }}/v1/health-check"
