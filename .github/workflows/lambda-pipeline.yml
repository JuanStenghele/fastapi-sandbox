name: Lambda - CI/CD Pipeline

on:
  workflow_dispatch

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test/requirements.txt

      - name: Run tests with coverage
        run: |
          pytest test -v --cov=src --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URL
        id: ecr
        run: |
          echo "repository_url=$(aws ssm get-parameter \
            --name "/${{ vars.APP_NAME }}/ecr/repository-url" \
            --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Build and push to ECR
        env:
          REPOSITORY_URL: ${{ steps.ecr.outputs.repository_url }}
        run: |
          docker build -t "$REPOSITORY_URL:latest" .
          docker push "$REPOSITORY_URL:latest"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ECR repository URL
        id: ecr
        run: |
          echo "repository_url=$(aws ssm get-parameter \
            --name "/${{ vars.APP_NAME }}/ecr/repository-url" \
            --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: juans-fastapi-sandbox
          REPOSITORY_URL: ${{ steps.ecr.outputs.repository_url }}
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri "$REPOSITORY_URL:latest" \
            --publish

      - name: Wait for function update
        run: |
          aws lambda wait function-updated --function-name juans-fastapi-sandbox

      - name: Health check
        env:
          FUNCTION_NAME: juans-fastapi-sandbox
        run: |
          URL=$(aws lambda get-function-url-config --function-name $FUNCTION_NAME --query FunctionUrl --output text)
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "$URL/v1/health-check"
