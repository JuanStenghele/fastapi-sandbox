name: Get SSM Parameter
description: Fetch a value from AWS Systems Manager Parameter Store

inputs:
  name:
    description: Full parameter name (path)
    required: true
  with_decryption:
    description: Decrypt the value (required for SecureString parameters)
    required: false
    default: 'false'

outputs:
  value:
    description: The parameter value
    value: ${{ steps.get.outputs.value }}

runs:
  using: composite
  steps:
    - id: get
      shell: bash
      env:
        WITH_DECRYPTION: ${{ inputs.with_decryption }}
      run: |
        DECRYPT_FLAG=""
        [ "$WITH_DECRYPTION" = "true" ] && DECRYPT_FLAG="--with-decryption"
        value=$(aws ssm get-parameter --name "${{ inputs.name }}" $DECRYPT_FLAG --query Parameter.Value --output text)
        echo "value=$value" >> "$GITHUB_OUTPUT"
